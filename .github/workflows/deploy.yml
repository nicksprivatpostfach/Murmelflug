# Lädt das Spiel bei jedem Push auf "main" per FTP zu netcup hoch.
# Einmalig im Repo unter Settings > Secrets and variables > Actions anlegen:
#   FTP_SERVER   (z. B. hosting123456.a2e.netcup.net)
#   FTP_USER     (FTP-Benutzer aus dem netcup WCP)
#   FTP_PASSWORD
#   FTP_DIR      (Zielordner, z. B. /murmelflug/ oder /httpdocs/murmelflug/)
name: Deploy zu netcup
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
